<div class="discover-page">
  <header class="discover-search">
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="Buscar livros, autores ou editoras" />
    </div>
  </header>

  <section class="trending-section">
    <div class="section-header">
      <h2>Assuntos em alta</h2>
      <span class="see-all">Ver tudo</span>
    </div>
    <div class="tag-cloud">
      <span class="tag-pill">Trendings aqui</span>
    </div>
  </section>

  <section class="trending-section">
    <div class="section-header">
      <h2>Livros em alta</h2>
      <a class="see-all" routerLink="/todos-livros">Ver tudo</a>
    </div>
    <div class="trending-row book-cards">
  <app-book-cover-card
    *ngFor="let livro of livros | slice:0:10"
    [livro]="livro">
  </app-book-cover-card>
</div>
  </section>

  <section class="trending-section">
    <div class="section-header">
      <h2>Editoras em alta</h2>
      <span class="see-all">Ver tudo</span>
    </div>
    <div class="trending-row">
  <a href="" *ngFor="let editora of editoras">
    <app-editora-card [editora]="editora"></app-editora-card>
  </a>
</div>
  </section>

  <section class="trending-section">
    <div class="section-header">
      <h2>Autores em alta</h2>
      <span class="see-all">Ver tudo</span>
    </div>
    <div class="trending-row">
      <a href="" *ngFor="let autor of autores | slice:0:10">
        <app-autor
            [autor]="autor"> </app-autor>
        </a>
    </div>
  </section>


   <section class="trending-section">
    <div class="section-header">
      <h2>Usuários mais seguidos</h2>
      <span class="see-all">Ver tudo</span>
    </div>
    <div class="trending-row">
      <a href="" *ngFor = "let usuario of usuarios">
        <app-usuario-card [usuario]="usuario"> </app-usuario-card>
      </a>

    </div>
  </section>
</div>
