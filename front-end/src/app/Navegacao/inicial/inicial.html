<div class="discover-page">
  <header class="discover-search">
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="Buscar livros, autores ou editoras" />
    </div>
  </header>

  <section class="trending-section">
    <div class="section-header">
      <h2>Assuntos em alta</h2>
      <a class="see-all" routerLink="/trendings">Ver tudo</a>
    </div>
    <div class="tag-cloud">
      <span class="tag-pill">Trendings aqui</span>
    </div>
  </section>

  <section class="trending-section">
    <div class="section-header">
      <h2>Livros em alta</h2>
      <a class="see-all" routerLink="/todos-livros">Ver tudo</a>
    </div>
    <div class="trending-row book-cards">
  <a *ngFor="let livro of livros | slice:0:5"
     [routerLink]="['/detalhesLivro', livro.id]">
    <app-book-cover-card [livro]="livro"></app-book-cover-card>
  </a>
</div>
  </section>

  <section class="trending-section">
    <div class="section-header">
      <h2>Editoras em alta</h2>
      <a class="see-all" routerLink="/todas-editoras">Ver tudo</a>
    </div>
    <div class="trending-row">
    <a *ngFor="let editora of editoras | slice:0:5"
      [routerLink]="['/detalhesEditora', editora.id]">
    <app-editora-card [editora]="editora"></app-editora-card>
  </a>
</div>
  </section>

  <section class="trending-section">
    <div class="section-header">
      <h2>Autores em alta</h2>
      <a class="see-all" routerLink="/todos-autores">Ver tudo</a>
    </div>
    <div class="trending-row">
      <a *ngFor="let autor of autores | slice:0:5"
        [routerLink]="['/detalhesAutor', autor.id]">
        <app-autor-card
            [autor]="autor"> </app-autor-card>
        </a>
    </div>
  </section>


   <section class="trending-section">
    <div class="section-header">
      <h2>Usuários mais seguidos</h2>
      <a class="see-all" routerLink="/todos-usuarios">Ver tudo</a>
    </div>
    <div class="trending-row">
      <a href="" *ngFor = "let usuario of usuarios | slice:0:5">
        <app-usuario-card [usuario]="usuario"> </app-usuario-card>
      </a>

    </div>
  </section>
</div>
