<div class="library-page">

  <div class="library-search">
    <div class="search-bar">

      <svg class="search-icon" viewBox="0 0 24 24" fill="none">
        <circle
          cx="11"
          cy="11"
          r="7"
          stroke="currentColor"
          stroke-width="2"
        />

        <path
          d="M21 21l-4.3-4.3"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>

      <input
        type="text"
        [(ngModel)]="search"
        (input)="filtrarEditoras()"
        placeholder="Buscar editoras"
      />

    </div>
  </div>

  <div class="editora-cards">

    <a *ngFor="let editora of editorasFiltradas" [routerLink]="['/detalhesEditora', editora.id]">

      <app-editora-card
        [editora]="editora">
      </app-editora-card>

    </a>

  </div>

  <p *ngIf="nenhumaEditora" class="nenhum">
    Nenhuma Editora Encontrada
  </p>

</div>
