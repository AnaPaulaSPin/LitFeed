<div class="users-page">

  <div class="users-search">
    <div class="search-bar">

      <svg class="search-icon" viewBox="0 0 24 24" fill="none">
        <circle
          cx="11"
          cy="11"
          r="7"
          stroke="currentColor"
          stroke-width="2"
        />

        <path
          d="M21 21l-4.3-4.3"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>

      <input
        type="text"
        [(ngModel)]="search"
        (input)="filtrarUsuarios()"
        placeholder="Buscar usuários por Username"
      />

    </div>
  </div>

  <div class="usuario-cards">

    <a href="" *ngFor="let usuario of usuariosfiltrados">

      <app-usuario-card
        [usuario]="usuario">
      </app-usuario-card>

    </a>

  </div>

  <p *ngIf="nenhumUsuario" class="nenhum">
    Nenhum Usuário Encontrado
  </p>

</div>
