  <!-- ***** CABEÇARIO ***** -->
  <header class="header-area header-sticky wow slideInDown" data-wow-duration="0.75s" data-wow-delay="0s">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <nav class="main-nav">
            <!-- ***** Logo Start ***** -->
            <a href="index.html" class="logo">
              <img src="\assets\Logo\Logo_navbar.png" alt="Chain App Dev">
            </a>
            <!-- ***** Logo End ***** -->
            <!-- ***** Menu Start ***** -->
            <ul class="nav">
              <li class="scroll-to-section"><a href="feed" class="active">Feed</a></li>
              <li class="scroll-to-section"><a href="biblioteca ">Biblioteca</a></li>
              <li class="scroll-to-section"><a href="#about">Destaques</a></li>


<div class="user-menu-wrap">

  <button class="mini-photo-wrapper" type="button" (click)="abrirMenu()">
  <img
    class="mini-photo"
     [src]="user.fotoPerfil" alt="Foto de perfil">
</button>


  <div class="menu-container" *ngIf="menuAberto">
    <ul class="user-menu">
      <div class="profile-highlight">
        <img
  class="mini-photo"
  [src]="user.fotoPerfil"
  alt="Foto de perfil"
  width="36"
  height="36"
/>
        <div class="details">
          <div id="profile-name">{{ user.nome }}</div>
          <div id="profile-footer">{{ user.email }}</div>
        </div>
      </div>
      <li class="user-menu__item">
        <a class="user-menu-link" href="#">
          <div>Configurações</div>
        </a>
      </li>
      <li class="user-menu__item">
        <a class="user-menu-link" href="#">
          <div>Perfil</div>
        </a>
      </li>
      <li class="user-menu__item">
        <a class="user-menu-link" href="#">
          <div>Notificações</div>
        </a>
      </li>
      <div class="footer">
        <li class="user-menu__item"><a class="user-menu-link" href="#" style="color: #F44336;">Sair</a></li>
        <li class="user-menu__item"><a class="user-menu-link" href="#">Configurações</a></li>
      </div>
    </ul>
  </div>
</div>

            </ul>
            <a class='menu-trigger'>
                <span>Menu</span>
            </a>
            <!-- ***** Menu End ***** -->
          </nav>
        </div>
      </div>
    </div>
  </header>
  <!-- ***** Header Area End ***** -->
