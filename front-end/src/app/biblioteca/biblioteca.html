
<div class="library-tabs-wrapper">
  <ul class="library-tabs" role="tablist">
    <li class="tab active" role="tab" (click)="setFilter('todos')">
      Todos <span class="count">{{quantidadeEdicoes}}</span>
    </li>
    <li class="tab" role="tab" (click)="setFilter('lendo')">
      Lendo <span class="count">0</span>
    </li>
    <li class="tab" role="tab" (click)="setFilter('ler-mais-tarde')">
      Ler mais tarde <span class="count">0</span>
    </li>
    <li class="tab" role="tab" (click)="setFilter('pausado')">
      Pausado <span class="count">0</span>
    </li>
    <li class="tab" role="tab" (click)="setFilter('abandonado')">
      Abandonado <span class="count">0</span>
    </li>
    
  </ul>
  <div class="book-cards">
  <app-book-cover-card
    *ngFor="let livro of edicoes"
    [livro]="livro">
  </app-book-cover-card>
</div>
</div>
