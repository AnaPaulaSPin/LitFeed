<div class="card-livro">

  <img [src]="edicao.capa" [alt]="edicao.livro.titulo">

  <div class="card-livro-info">

    <h3>{{ edicao.livro.titulo }}</h3>

    <p>Autor: {{ edicao.livro.autor.nome }}</p>

    <p>Editora: {{ edicao.editora.nome }}</p>

    <p>Ano: {{ edicao.ano }}</p>

    <p>ISBN: {{ edicao.livro.isbn }}</p>

    <p>Páginas: {{ edicao.total_paginas }}</p>

  </div>

</div>
