<div class="card-pesquisa-livro">

  <div class="card-header">

    <button type="button" (click)="fechar.emit()">
      ×
    </button>
  </div>

  <div class="barra-pesquisa">
    <input
      type="text"
      placeholder="Pesquisar livro..."
      #nomeLivro
    >

    <button
      type="button"
      class="btn-pesquisar-livro"
      (click)="pesquisarLivro(nomeLivro.value)"
    >
      <i class="uil uil-search"></i>
    </button>
  </div>

<div class="resultado-pesquisa">

  <label class="titulo-edicoes">Edições disponíveis</label>

  <div class="lista-edicoes">

    <button
      *ngFor="let edicao of listaEdicoes"
      type="button"
      class="botao-edicao"
      (click)="selecionarEdicao(edicao)">

      <app-card-livro [edicao]="edicao"></app-card-livro>

    </button>

  </div>

</div>

</div>
