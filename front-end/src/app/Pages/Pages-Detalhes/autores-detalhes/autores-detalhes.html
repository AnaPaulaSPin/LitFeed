<div class="autor-page">

  <!-- VOLTAR -->
  <button class="btn-voltar" (click)="voltar()">
    <span>←</span>
    Voltar
  </button>


  <!-- INFORMAÇÕES DO AUTOR -->
  <section class="autor-header">

    <div class="autor-foto">
      <img
        [src]="autor?.foto"
        [alt]="autor?.nome"
      />
    </div>

    <div class="autor-info">

      <h1>{{ autor?.nome }}</h1>

      <p>
        biografia
      </p>

    </div>

  </section>


  <!-- EDIÇÕES RELACIONADAS -->
  <section class="autor-edicoes">

    <div class="secao-titulo">
      <h2>Edições relacionadas</h2>

      <p>
        Livros e edições deste autor.
      </p>
    </div>


    <div class="edicoes-grid">

         <div *ngFor="let edicao of edicoes">
          <a  [routerLink]="['/detalhesLivro', edicao.livro.id]">
            <app-card-capa-livro [livro]="edicao"> </app-card-capa-livro>
          </a>
        </div>

    </div>

  </section>

</div>
