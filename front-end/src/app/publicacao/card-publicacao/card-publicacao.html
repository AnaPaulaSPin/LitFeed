
  <div class="card">

    <!-- Card top -->
    <div class="card-body">

      <div class="card-header">

        <!-- Image + name -->
        <header class="user-header">

          <div class="user-info">
            <a class="avatar-wrapper" href="#">
              <img
                class="avatar"
                [src]="user.fotoPerfil"
                alt="User 01"
              />
            </a>

            <div class="user-text">
              <h2 class="user-name">{{ user.nome }}</h2>
              <div class="user-country">
                <span>→</span>
                <span>{{ user.biografia }}</span>
              </div>
            </div>

          </div>

        </header>

        <!-- Menu button (sem Alpine, você ativa depois no Angular) -->
        <div class="menu">
          <button class="menu-button" (click)="abrirMenu()">
            ⋯
          </button>

          <div class="dropdown" [class.hidden]="!MenuAberto">
            <a href="#">Option</a>
            <a href="#">Option</a>
            <a class="danger" href="#">Denunciar</a>
          </div>
        </div>

      </div>

      <!-- Publicacao Conteudo-->
      <div class="texto">
        <h3> {{publicacao.titulo}} </h3>
        <p>
          {{publicacao.conteudo}}
        </p>
      </div>
      <div *ngIf="publicacao.edicao != null">
        <app-card-livro
         [edicao]="publicacao.edicao"> </app-card-livro>
      </div>
    </div>


    <!-- Footer -->
<div class="card-footer">

  <button class="card-action click-button" (click)="curtir()">
    <img
      class="icon"
      [src]="curtido ? 'assets/icons/Publicação/Curtida.png' : 'assets/icons/Publicação/NaoCurtida.png'"
      alt="Curtir"
    />
    <span>curtir</span>
  </button>

  <button class="card-action click-button" (click)=" republicar()">
    <img
      class="icon"
      [src]="republicado ? 'assets/icons/Publicação/Republicado.png' : 'assets/icons/Publicação/NaoRepublicado.png'"
      alt=""
    />
    <span>republicar</span>
  </button>

  <button class="card-action click-button" (click)="comentarios()">
    <img
      class="icon"
      src="assets/icons/Publicação/Comentarios.png"
      alt="Curtir"
    />
    <span>Comentarios</span>
  </button>



</div>

  </div>
